# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    filter_sets:
        small_thumb:
            quality: 75
            filters:
                thumbnail:
                    size: [400, 400]
                    mode: inset
        medium_thumb:
            quality: 75
            filters:
                thumbnail:
                    size: [700, 700]
                    mode: inset
        big_thumb:
            quality: 75
            filters:
                thumbnail:
                    size: [1000, 1000]
                    mode: inset
